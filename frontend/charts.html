<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biểu đồ - Dự đoán nguy cơ tiểu đường</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <h1>Biểu đồ phân tích mô hình</h1>
          <p>Xem chi tiết hiệu suất và so sánh các mô hình.</p>
        </div>
        <nav class="page-nav">
          <a href="index.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Trang dự đoán
          </a>
          <a href="admin.html" class="nav-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Admin
          </a>
          <a href="charts.html" class="nav-link active">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            Biểu đồ
          </a>
        </nav>
      </header>

      <section class="panel comparison-panel full-width">
        <div class="tabs" role="tablist">
          <button type="button" class="tab-button active" data-tab="metrics">Chỉ số</button>
          <button type="button" class="tab-button" data-tab="roc">ROC</button>
          <button type="button" class="tab-button" data-tab="pr">Precision-Recall</button>
          <button type="button" class="tab-button" data-tab="importance">Đặc trưng</button>
          <button type="button" class="tab-button" data-tab="confusion">Confusion</button>
        </div>

        <div id="metricsTab" class="tab-content active">
          <div class="chart-wrap">
            <canvas id="metricsChart"></canvas>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Mô hình</th>
                  <th>Độ chính xác</th>
                  <th>Precision</th>
                  <th>Recall</th>
                  <th>F1</th>
                  <th>ROC-AUC</th>
                </tr>
              </thead>
              <tbody id="metricsBody"></tbody>
            </table>
          </div>
        </div>

        <div id="rocTab" class="tab-content">
          <div class="chart-wrap">
            <canvas id="rocChart"></canvas>
          </div>
        </div>

        <div id="prTab" class="tab-content">
          <div class="chart-wrap">
            <canvas id="prChart"></canvas>
          </div>
        </div>

        <div id="importanceTab" class="tab-content">
          <div class="segmented">
            <button type="button" class="segment-button active" data-importance-model="random_forest">
              Random Forest
            </button>
            <button type="button" class="segment-button" data-importance-model="xgboost">
              XGBoost
            </button>
          </div>
          <div class="chart-wrap">
            <canvas id="importanceChart"></canvas>
          </div>
        </div>

        <div id="confusionTab" class="tab-content">
          <div class="chart-wrap">
            <canvas id="confusionBarChart"></canvas>
          </div>
          <div id="confusionMatrices" class="matrix-grid"></div>
        </div>
      </section>
    </main>

    <script src="charts.js"></script>
  </body>
</html>
